baseURL = 'https://digitaldias.com/'
languageCode = 'en-us'
title = 'DigitalDias - Pedro Dias'
author = 'Pedro Dias'
copyright = '© 2025 Pedro Dias. All rights reserved.'
enableGitInfo = true
defaultContentLanguage = 'en'

# Pagination
[pagination]
  pagerSize = 10

# Taxonomies
[taxonomies]
  category = 'categories'
  tag = 'tags'

# Markup settings
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow HTML in markdown
  [markup.highlight]
    style = 'dracula'
    lineNos = false
    lineNumbersInTable = false
    codeFences = true
    guessSyntax = true
    noClasses = false

# Params
[params]
  description = 'Software Architect, Content Creator, and Family Man based in Frogner, Lillestrøm'
  author = 'Pedro Dias'
  location = 'Frogner, Lillestrøm'
  email = 'pedro.dias@tradesolution.no'
  # Homepage sidebar line under the name
  bio = "Acting Chief AI Officer at Tradesolution. Writing code since 1982. Too many strong opinions about software, AI and speaker placement."
  # Homepage motto under the name; " · " separates the phrases
  motto = "Norwegian pragmatism · Portuguese stubbornness · Too much code"
  
  # Social links
  [params.social]
    linkedin = 'https://linkedin.com/in/digitaldias'
    github = 'https://github.com/digitaldias'
    youtube_digitaldias = 'https://youtube.com/@digitaldias'
    youtube_digitalhome = 'https://www.youtube.com/channel/UC03xD6JiBNZebtFOv9zqTVg'
    flickr = 'https://flickr.com/photos/digitaldias'
    facebook = 'https://facebook.com/pedrodiaspt'
  
  # Stats for hero section
  [params.stats]
    age = 41
    photos = 172
    channels = 2
    family = '∞'
  
  # Support links
  [params.support]
    kofi = 'https://ko-fi.com/digitaldias'
  
  [params.currently]
    building   = "planemode: Claude Code on a local model, no internet"
    tinkering  = "Shrinking context windows to make local models usable"
    annoyed_by = "Norwegian no longer has USB power in its seats, even though the plugs are there"

  [params.photo]
    src = "/images/pedro.jpg"
    alt = "Pedro Dias"

  # Positions held: refreshed with every new post (CLAUDE.md, "Writing a new blog post").
  # since = month the position was taken (YYYY-MM); post = path of the post that argues it.
  [[params.positions]]
    text  = "Typed decision APIs like Jev are AI's next big shift for software."
    since = "2026-09"
    post  = "/blog/2026-09-19-jev-before-the-waitlist/"
  [[params.positions]]
    text  = "Claude Code's cache expiration is a hidden cost nobody talks about."
  [[params.positions]]
    text  = "Buy a 3D printer for your household."
    post  = "/blog/2026-05-23-ai-at-the-workbench/"
  [[params.positions]]
    text  = "Let a local model do the first pass of your news. Keep the last pass yourself."
    since = "2026-11"
    post  = "/blog/2026-11-01-local-models-news-filter/"
  [[params.positions]]
    text  = "On a flight, write the spec offline. Let a frontier model code it when you land."
    since = "2026-11"
    post  = "/blog/2026-11-02-local-llm-on-a-plane/"

  # Giscus comments configuration
  [params.giscus]
    repo = "digitaldias/StaticWebSite"
    repoId = "R_kgDOQZVsAA"
    category = "General"
    categoryId = "DIC_kwDOQZVsAM4C1Zhn"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    lang = "en"

  # Public source repo — article revision history links point here
  [params.source]
    repo = "https://github.com/digitaldias/StaticWebSite"
    contentPath = "src/content"

  # Reading levels on Microsoft's 100-400 conference session scale. data/depth.yaml holds the
  # decision model's raw score per section (`just depth`); a score at or above a cutoff climbs a
  # level. Recalibrate against scripts/depth-labels.json with `python scripts/depth-score.py --calibrate`.
  # `reader` starts with who the level is for, then a colon; the turnout quotes what follows it.
  [params.depth]
    cutoffs = [180, 255, 320]
    [[params.depth.levels]]
      n = 100
      name = "The gist"
      reader = "No prior knowledge: what it is, why it matters and where it is heading."
    [[params.depth.levels]]
      n = 200
      name = "The overview"
      reader = "You have heard of it: what it can do, where it fits, and a little code to make a point."
    [[params.depth.levels]]
      n = 300
      name = "Hands-on"
      reader = "You have used it: how to build the solution, with real code and how the parts fit together."
    [[params.depth.levels]]
      n = 400
      name = "Full geek"
      reader = "You build with it: the internals, why it was designed that way, and what that means in practice."

# An explicit front-matter lastmod always wins over git history
[frontmatter]
  lastmod = ['lastmod', ':git', 'date']

# Related reading — tags weigh most, categories break ties
[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = 'tags'
    weight = 100
  [[related.indices]]
    name = 'categories'
    weight = 40

# Asset processing
[build]
  writeStats = true

# Sitemap configuration
[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# RSS and JSON Feed configuration
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']
  blog = ['HTML', 'RSS', 'JSON']

# Languages: English is the default, Norwegian lives under /nb/. A post is translated by a
# sibling file named <post>.nb.md; pages without a translation stay English.
[languages]
  [languages.en]
    languageCode = 'en-us'
    languageName = 'EN'
    weight = 1
  [languages.nb]
    languageCode = 'nb-NO'
    languageName = 'NO'
    weight = 2
    [languages.nb.params]
      description = 'Programvarearkitekt, innholdsprodusent og familiemann på Frogner i Lillestrøm'
      bio = "Konstituert Chief AI Officer i Tradesolution. Har skrevet kode siden 1982. Altfor mange sterke meninger om programvare, AI og høyttalerplassering."
      motto = "Norsk pragmatisme · Portugisisk stahet · For mye kode"
      [languages.nb.params.giscus]
        lang = "no"
      [languages.nb.params.depth]
        [[languages.nb.params.depth.levels]]
          n = 100
          name = "Hovedpoenget"
          reader = "Ingen forkunnskaper: hva det er, hvorfor det er viktig og hvor det er på vei."
        [[languages.nb.params.depth.levels]]
          n = 200
          name = "Oversikten"
          reader = "Du har hørt om det: hva det kan gjøre, hvor det passer inn og litt kode som viser poenget."
        [[languages.nb.params.depth.levels]]
          n = 300
          name = "Praksis"
          reader = "Du har brukt det: hvordan du bygger løsningen, med kode som kjører, og hvordan delene henger sammen."
        [[languages.nb.params.depth.levels]]
          n = 400
          name = "Full nerd"
          reader = "Du bygger med det: hvordan det virker innvendig, hvorfor det er laget slik og hva det betyr i praksis."
      [languages.nb.params.currently]
        building   = "planemode: Claude Code på en lokal modell, uten internett"
        tinkering  = "Krymping av kontekstvinduer så lokale modeller blir brukbare"
        annoyed_by = "Norwegian-flyene har ikke lenger USB-strøm i setene, selv om kontaktene fortsatt sitter der"
      [[languages.nb.params.positions]]
        text  = "Typede beslutnings-API-er som Jev er det neste store AI-skiftet for programvare."
        since = "2026-09"
        post  = "/blog/2026-09-19-jev-before-the-waitlist/"
      [[languages.nb.params.positions]]
        text  = "At cachen i Claude Code utløper, er en skjult kostnad ingen snakker om."
      [[languages.nb.params.positions]]
        text  = "Kjøp en 3D-printer til hjemmet."
        post  = "/blog/2026-05-23-ai-at-the-workbench/"
      [[languages.nb.params.positions]]
        text  = "La en lokal modell sortere nyhetene dine først. Den siste gjennomgangen tar du selv."
        since = "2026-11"
        post  = "/blog/2026-11-01-local-models-news-filter/"
      [[languages.nb.params.positions]]
        text  = "Skriv spesifikasjonen offline på flyet. La en frontier-modell kode den når du lander."
        since = "2026-11"
        post  = "/blog/2026-11-02-local-llm-on-a-plane/"
