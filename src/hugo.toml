baseURL = 'https://digitaldias.com/'
languageCode = 'en-us'
title = 'DigitalDias - Pedro Dias'
author = 'Pedro Dias'
copyright = '© 2025 Pedro Dias. All rights reserved.'
enableGitInfo = true

# Pagination
[pagination]
  pagerSize = 10

# Taxonomies
[taxonomies]
  category = 'categories'
  tag = 'tags'

# Markup settings
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow HTML in markdown
  [markup.highlight]
    style = 'dracula'
    lineNos = false
    lineNumbersInTable = false
    codeFences = true
    guessSyntax = true
    noClasses = false

# Params
[params]
  description = 'Software Architect, Content Creator, and Family Man based in Frogner, Lillestrøm'
  author = 'Pedro Dias'
  location = 'Frogner, Lillestrøm'
  email = 'pedro.dias@tradesolution.no'
  # Homepage sidebar line under the name
  bio = "Acting Chief AI Officer at Tradesolution. Writing code since 1982. Too many strong opinions about software, AI and speaker placement."
  
  # Social links
  [params.social]
    linkedin = 'https://linkedin.com/in/digitaldias'
    github = 'https://github.com/digitaldias'
    youtube_digitaldias = 'https://youtube.com/@digitaldias'
    youtube_digitalhome = 'https://youtube.com/@digitalhome'
    flickr = 'https://flickr.com/photos/digitaldias'
    facebook = 'https://facebook.com/pedrodiaspt'
  
  # Stats for hero section
  [params.stats]
    age = 41
    photos = 172
    channels = 2
    family = '∞'
  
  # Support links
  [params.support]
    kofi = 'https://ko-fi.com/digitaldias'
  
  [params.currently]
    building   = "A local, Jev-compatible decision API on oMLX"
    listening  = "Ghost Notes, Mono Neon"
    tinkering  = "Tuning oMLX's concurrency and cache settings on the M5 Pro"
    annoyed_by = "My back pain"

  [params.photo]
    src = "/images/pedro.jpg"
    alt = "Pedro Dias"

  # Positions held: refreshed with every new post (CLAUDE.md, "Writing a new blog post").
  # since = month the position was taken (YYYY-MM); post = path of the post that argues it.
  [[params.positions]]
    text  = "Typed decision APIs like Jev are AI's next big shift for software."
    since = "2026-09"
    post  = "/blog/2026-09-19-jev-before-the-waitlist/"
  [[params.positions]]
    text  = "Claude Code's cache expiration is a hidden cost nobody talks about."
  [[params.positions]]
    text  = "Buy a 3D printer for your household."
    post  = "/blog/2026-05-23-ai-at-the-workbench/"
  [[params.positions]]
    text  = "Keep your home automations simple."

  # Giscus comments configuration
  [params.giscus]
    repo = "digitaldias/StaticWebSite"
    repoId = "R_kgDOQZVsAA"
    category = "General"
    categoryId = "DIC_kwDOQZVsAM4C1Zhn"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    lang = "en"

  # Public source repo — article revision history links point here
  [params.source]
    repo = "https://github.com/digitaldias/StaticWebSite"
    contentPath = "src/content"

# An explicit front-matter lastmod always wins over git history
[frontmatter]
  lastmod = ['lastmod', ':git', 'date']

# Related reading — tags weigh most, categories break ties
[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = 'tags'
    weight = 100
  [[related.indices]]
    name = 'categories'
    weight = 40

# Asset processing
[build]
  writeStats = true

# Sitemap configuration
[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# RSS and JSON Feed configuration
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']
  blog = ['HTML', 'RSS', 'JSON']
