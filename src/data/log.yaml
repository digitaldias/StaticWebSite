# Ship's log: short dated notes, newest first. Published posts join automatically.
# tag: Shipped (solid chip) or Site, Fixed, Building, Note (quiet chip). text is Markdown.
- date: 2026-11-04
  tag: Shipped
  text: "A [Supporters](/supporters/) page that thanks everyone who bought me a coffee, by name and message. Until the first one arrives, a hopeful dog in a party hat keeps the seat warm."
  text_nb: "En side for [støttespillere](/nb/supporters/) som takker alle som har spandert en kaffe, med navn og melding. Til den første kommer, holder en håpefull hund med festhatt plassen varm."
- date: 2026-11-04
  tag: Shipped
  text: "When someone buys me a coffee on Ko-fi and keeps it public, the footer now says thank you by name. A small Azure Function catches Ko-fi's webhook; the site itself stays static."
  text_nb: "Når noen spanderer en kaffe på Ko-fi og lar det være offentlig, takker bunnteksten nå ved navn. En liten Azure Function tar imot Ko-fi-webhooken, mens selve nettstedet forblir statisk."
- date: 2026-11-04
  tag: Site
  text: "The briefing line on the homepage is worded differently with each edition, from parts that will not repeat as a whole for about six years. The numbers stay the same, only the wording changes."
  text_nb: "Briefinglinjen på forsiden får ny ordlyd for hver utgave, satt sammen av deler som ikke gjentar seg som helhet på rundt seks år. Tallene er de samme, bare formuleringen endres."
- date: 2026-11-04
  tag: Site
  text: "A new footer: where to read on, where else to find me, a quiet way to buy me a coffee, and -30-, the newsroom mark for the end of a story."
  text_nb: "Ny bunntekst: hvor du kan lese videre, hvor du ellers finner meg, en stille måte å spandere en kaffe på, og -30-, avisjargong for slutten på en sak."
- date: 2026-11-04
  tag: Shipped
  text: "The homepage opens on today's [morning briefing](/briefing/): how many news stories a local model read overnight and how many it kept, one mark per story. It updates with each new edition."
  text_nb: "Forsiden åpner med dagens [morgenbriefing](/briefing/): hvor mange nyhetssaker en lokal modell leste i natt og hvor mange den beholdt, én strek per sak. Den oppdateres med hver nye utgave."
- date: 2026-11-02
  tag: Fixed
  text: "Comments and reactions failed to load on Norwegian posts. Giscus has no Norwegian translation, so the comment box stays in English there."
  text_nb: "Kommentarer og reaksjoner lastet ikke på norske innlegg. Giscus finnes ikke på norsk, så kommentarfeltet er på engelsk der."
- date: 2026-11-02
  tag: Fixed
  text: "The Norwegian side was missing the Log, Photographs and About pages, the reading level names and the labels on the article page. All of it is translated now."
  text_nb: "Den norske siden manglet Logg, Fotografier og Om meg, navnene på lesenivåene og tekstene på artikkelsiden. Alt er oversatt nå."
- date: 2026-11-02
  tag: Shipped
  text: "Listening on the homepage now picks an artist from my top artists on the Spotify API. It links to a page with the history of earlier picks."
  text_nb: "«Hører på» på forsiden velger nå en artist blant de jeg spiller mest, hentet via Spotify-API-et. Den lenker til en side med tidligere valg."
- date: 2026-11-02
  tag: Shipped
  text: "English or Norwegian. A switch in the header picks the language and the site remembers it. Every post now exists in both."
  text_nb: "Engelsk eller norsk. En bryter øverst på siden velger språk, og nettstedet husker valget. Alle innlegg finnes nå på begge språk."
- date: 2026-11-02
  tag: Shipped
  text: "Reading levels on Microsoft's 100-400 scale. Every post shows how deep it goes and marks where the gist ends, scored per section by a local decision model."
  text_nb: "Lesenivåer på Microsofts skala fra 100 til 400. Hvert innlegg viser hvor dypt det går og markerer hvor hovedpoenget slutter. En lokal beslutningsmodell vurderer hver seksjon."
- date: 2026-11-02
  tag: Fixed
  text: "The DigitalHome YouTube link on the About page pointed at a channel that doesn't exist."
  text_nb: "YouTube-lenken til DigitalHome på Om meg-siden pekte på en kanal som ikke finnes."
- date: 2026-11-01
  tag: Shipped
  text: "Reader tools: a route chart in the margin, a resume slip, and quotable paragraphs."
  text_nb: "Leseverktøy: et rutekart i margen, en lapp som husker hvor du slapp, og avsnitt du kan sitere."
- date: 2026-11-01
  tag: Site
  text: "Article furniture: folio line, revision record, See also. New posts open with a TL;DR."
  text_nb: "Artikkeldetaljer: foliolinje, endringslogg og «Se også». Nye innlegg åpner med et TL;DR."
- date: 2026-09-19
  tag: Fixed
  text: "The live stylesheet went unstyled behind a cached 404 at the CDN. Forced a new fingerprint and wrote the deploy race down."
  text_nb: "Nettstedet mistet all stil fordi CDN-et hadde bufret en 404 for stilarket. Jeg tvang fram et nytt fingeravtrykk og dokumenterte kappløpet i deployen."
