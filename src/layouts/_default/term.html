{{- define "main" -}}
<div class="wrap">
  <header class="page-head">
    <div>
      {{- with .Parent }}<a class="k" href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}
      <h1 class="d split-words">{{ .Title }}</h1>
    </div>
    <p class="lift">{{ i18n "postsCount" (len .Pages) }}</p>
  </header>
  {{- if eq .Data.Plural "categories" }}{{ partial "category-filter.html" . }}{{ end }}
  {{- partial "archive.html" (dict "pages" .Pages "front" false) }}
</div>
{{- end -}}
