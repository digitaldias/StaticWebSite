{{- define "main" -}}
<div class="wrap">
  <header class="page-head">
    <h1 class="d split-words">{{ .Title }}</h1>
    <p class="lift">{{ i18n "termsCount" (len .Pages) }}</p>
  </header>
  <ul class="taxonomy-list">
    {{- range .Pages }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a><span class="m">{{ len .Pages }}</span></li>
    {{- end }}
  </ul>
</div>
{{- end -}}
