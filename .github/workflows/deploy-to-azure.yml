name: Build and Deploy Hugo Site to Azure Blob

on:
  push:
    branches:
      - main # or your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      # Setup Hugo
      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'

      # Build the site (set 'src' as your hugo site root)
      - name: Build Hugo site
        run: |
          cd src
          hugo --minify
          ls -la public/ | head -10  # Verify build output

      # Install Azure CLI & AzCopy
      - name: Install Azure CLI and AzCopy
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          AZCOPY_VERSION=$(curl -s https://api.github.com/repos/Azure/azure-storage-azcopy/releases/latest | grep tag_name | cut -d '"' -f 4)
          wget https://github.com/Azure/azure-storage-azcopy/releases/download/${AZCOPY_VERSION}/azcopy_linux_amd64_${AZCOPY_VERSION/v/}.tar.gz
          tar -xzf azcopy_linux_amd64_${AZCOPY_VERSION/v/}.tar.gz
          sudo cp azcopy_linux_amd64_${AZCOPY_VERSION/v/}/azcopy /usr/bin/

      # Upload files to Azure Blob Storage
      - name: Deploy to Azure Blob Storage ($web)
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          # Verify public directory exists before upload
          if [ ! -d "src/public" ]; then
            echo "ERROR: src/public directory does not exist after build!"
            exit 1
          fi
          echo "Uploading $(find src/public -type f | wc -l) files from src/public/"
          # Use Azure CLI for authenticated upload
          az storage blob upload-batch \
            --account-name "${AZURE_STORAGE_ACCOUNT}" \
            --account-key "${AZURE_STORAGE_KEY}" \
            --source "src/public" \
            --destination '$web' \
            --overwrite

      # Unlisted "briefing" section: staged locally by newsstream/scripts/publish_newsstream.py
      # and committed to the briefing/ folder at repo root (outside Hugo's src/ tree).
      - name: Deploy briefing pages ($web/briefing)
        if: hashFiles('briefing/**') != ''
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          az storage blob upload-batch \
            --account-name "${AZURE_STORAGE_ACCOUNT}" \
            --account-key "${AZURE_STORAGE_KEY}" \
            --source "briefing" \
            --destination '$web' \
            --destination-path briefing \
            --content-cache-control "no-cache, no-store, must-revalidate" \
            --overwrite

      # Retention: briefing/ only ever holds index.html (today) plus the last 4
      # dated pages (YYYY-MM-DD.html) - delete anything older that lingers.
      - name: Prune old briefing pages
        if: hashFiles('briefing/**') != ''
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          cutoff=$(date -u -d "-4 days" +%Y-%m-%d)
          az storage blob list \
            --account-name "${AZURE_STORAGE_ACCOUNT}" \
            --account-key "${AZURE_STORAGE_KEY}" \
            --container-name '$web' \
            --prefix "briefing/" \
            --query "[].name" -o tsv | while IFS= read -r name; do
              base="${name##*/}"
              if [[ "$base" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.html$ ]]; then
                blobdate="${base%.html}"
                if [[ "$blobdate" < "$cutoff" ]]; then
                  az storage blob delete \
                    --account-name "${AZURE_STORAGE_ACCOUNT}" \
                    --account-key "${AZURE_STORAGE_KEY}" \
                    --container-name '$web' \
                    --name "$name"
                  echo "deleted $name"
                fi
              fi
            done